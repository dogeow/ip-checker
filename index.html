<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="IP Checker - 全方位查询您的IP地址，从不同网络路径检测出口，快速判断直连与分流状态">
  <title>IP 地址检测</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%232d2d2d'/%3E%3Ctext x='50%25' y='54%25' text-anchor='middle' font-family='Arial' font-size='24' fill='%23e8e8e8'%3EIP%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="page-shell">
    <header class="hero">
      <div class="hero-text">
        <h1 class="hero-title">IP 地址检测</h1>
        <p class="hero-subtitle">从不同网络路径检测出口，快速判断直连与分流状态</p>
      </div>
    </header>

    <div class="center-wrap">
      <section class="control-panel" aria-label="检测控制">
        <div class="summary" id="summary">
          <div class="summary-icon" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
          </div>
          <div class="summary-content">
            <div class="summary-title">检测概览</div>
            <div class="summary-row">
              <div class="summary-status" id="summary-status" role="status" aria-live="polite">检测中…</div>
              <div class="summary-time" id="summary-time"></div>
            </div>
          </div>
          <button class="copy-all-btn" id="copy-all-btn" type="button" aria-label="复制全部 IP" title="复制全部 IP">
            <span aria-hidden="true">⧉</span>
          </button>
        </div>
        <button class="refresh-btn" id="refresh-btn" type="button" aria-label="重新检测">
          <span class="refresh-icon" aria-hidden="true">↻</span>
          <span class="refresh-text">重新检测</span>
        </button>
      </section>

      <main class="card-grid" id="result-grid"></main>
    </div>

    <footer class="footer-note">
      本页面所有检测均在浏览器端完成，不收集任何数据
    </footer>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>
  <div id="copy-tip" role="tooltip"></div>

  <script src="./core.js" defer></script>
  <script src="./browser-utils.js" defer></script>
  <script src="./ui-components.js" defer></script>
  <script src="./ui.js" defer></script>
  <script src="./detectors.js" defer></script>
  <script src="./app.js" defer></script>
</body>
</html>
