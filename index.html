<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="IP Checker - 全方位查询您的IP地址，从不同网络路径检测出口，快速判断直连与分流状态">
  <title>IP 地址检测</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="page-shell">
    <header class="hero">
      <div class="hero-text">
        <h1 class="hero-title">IP 地址检测</h1>
        <p class="hero-subtitle">从不同网络路径检测出口，快速判断直连与分流状态</p>
      </div>
      <button class="refresh-btn" id="refresh-btn" type="button" aria-label="重新检测">
        <span class="refresh-icon" aria-hidden="true">↻</span>
        <span class="refresh-text">重新检测</span>
      </button>
    </header>

    <div class="center-wrap">
      <!-- 汇总 -->
      <section class="summary" id="summary">
        <div class="summary-row">
          <div class="summary-title">检测汇总</div>
          <div class="summary-status" id="summary-status">检测中…</div>
        </div>
      </section>

      <main class="card-grid">
      <!-- 国内测试 -->
      <article class="card" data-key="domestic">
        <div class="card-header">
          <div class="card-icon domestic" aria-hidden="true">CN</div>
          <div class="card-title">从国内测试</div>
          <div class="card-status" aria-hidden="true"></div>
        </div>
        <div class="ip-row">
          <div id="domestic-ip" class="ip-display"><span class="loading">检测中</span></div>
          <button class="copy-btn" aria-label="复制 IP" title="复制 IP" data-copy-target="domestic-ip">📋</button>
        </div>
        <div id="domestic-location" class="ip-location"></div>
        <div class="card-desc">这是您访问国内网站所使用的 IP</div>
      </article>

      <!-- 国外测试 -->
      <article class="card" data-key="foreign">
        <div class="card-header">
          <div class="card-icon foreign" aria-hidden="true">INTL</div>
          <div class="card-title">从国外测试</div>
          <div class="card-status" aria-hidden="true"></div>
        </div>
        <div class="ip-row">
          <div id="foreign-ip" class="ip-display"><span class="loading">检测中</span></div>
          <button class="copy-btn" aria-label="复制 IP" title="复制 IP" data-copy-target="foreign-ip">📋</button>
        </div>
        <div id="foreign-location" class="ip-location"></div>
        <div class="card-desc">这是您访问海外站点所使用的 IP</div>
      </article>

      <!-- Google 测试 -->
      <article class="card" data-key="google">
        <div class="card-header">
          <div class="card-icon google" aria-hidden="true">G</div>
          <div class="card-title">从谷歌测试</div>
          <div class="card-status" aria-hidden="true"></div>
        </div>
        <div class="ip-row">
          <div id="google-ip" class="ip-display"><span class="loading">检测中</span></div>
          <button class="copy-btn" aria-label="复制 IP" title="复制 IP" data-copy-target="google-ip">📋</button>
        </div>
        <div id="google-location" class="ip-location"></div>
        <div class="card-desc">这是您访问谷歌系服务所使用的出口</div>
      </article>

      <!-- Cloudflare 测试 -->
      <article class="card" data-key="cf">
        <div class="card-header">
          <div class="card-icon cloudflare" aria-hidden="true">CF</div>
          <div class="card-title">从 Cloudflare 测试</div>
          <div class="card-status" aria-hidden="true"></div>
        </div>
        <div class="ip-row">
          <div id="cf-ip" class="ip-display"><span class="loading">检测中</span></div>
          <button class="copy-btn" aria-label="复制 IP" title="复制 IP" data-copy-target="cf-ip">📋</button>
        </div>
        <div id="cf-location" class="ip-location"></div>
        <div class="card-desc">这是您访问 Cloudflare 网站时的出口</div>
      </article>
    </main>
    </div>

    <footer class="footer-note">
      本页面所有检测均在浏览器端完成，不收集任何数据
    </footer>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>
  <div id="copy-tip" role="tooltip"></div>

  <script src="./app.js" defer></script>
</body>
</html>
